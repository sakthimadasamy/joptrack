# ===============================
# Local development (default profile)
# ===============================
# MySQL on localhost so `mvn spring-boot:run` works with no extra setup.
# DATAHOST/DB_* can still override any part of it.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_tracker}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Development-only JWT key. Production must set JWT_SECRET and is checked for
# this exact value by ProductionConfigValidator.
jwt.secret=${JWT_SECRET:c2FrdGhpLWpvYnRyYWNrLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.seed.enabled=${SEED_ENABLED:true}
