# ===============================
# Application
# ===============================
spring.application.name=job-tracker-backend
server.port=${PORT:8080}

# ===============================
# Datasource defaults to local MySQL; production can provide a JDBC URL.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_tracker}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:c2FrdGhpLWpvYnRyYWNrLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===============================
# Sample data seeding (set to false to skip)
# ===============================
app.seed.enabled=${SEED_ENABLED:true}
