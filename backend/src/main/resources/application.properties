# ===============================
# JobTrack - shared configuration
# ===============================
# Local development runs with no profile set and picks up application-local.properties.
# Production sets SPRING_PROFILES_ACTIVE=prod, which applies application-prod.properties
# where every secret has no default and a missing value fails at startup.
spring.application.name=job-tracker-backend
spring.profiles.default=local

server.port=${PORT:8080}
server.error.include-message=always

# Render/Railway terminate TLS in front of the app, so trust X-Forwarded-Proto
# and generate https:// absolute URLs.
server.forward-headers-strategy=framework

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# ===============================
# Connection pool
# ===============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Actuator
# ===============================
# The DB indicator is off so a database blip never fails the platform health
# check and triggers a restart loop; readiness is exposed separately.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.health.db.enabled=false

# ===============================
# Logging
# ===============================
logging.level.com.jobtracker=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:OFF}
