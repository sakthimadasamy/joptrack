# ===============================
# Production (SPRING_PROFILES_ACTIVE=prod)
# ===============================
# Nothing here has a fallback value on purpose. A missing variable must stop the
# deploy loudly rather than silently fall back to localhost or the demo key.

# DATABASE_URL is read directly from the environment by DataSourceConfig and
# takes priority over the value below, so pasting the Supabase connection
# string is enough on its own. Set SPRING_DATASOURCE_URL only if you are
# supplying a full JDBC URL instead, in which case DB_USERNAME/DB_PASSWORD are
# required too.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated frontend origins. Wildcards are supported, e.g.
# https://*.vercel.app to allow preview deployments. Bare "*" is rejected.
app.cors.allowed-origins=${CORS_ORIGINS:}

# Off by default: seeding creates a publicly known account
# (demo@jobtrack.com / demo1234) on a public URL. Set SEED_ENABLED=true only
# if you want that demo data.
app.seed.enabled=${SEED_ENABLED:false}
